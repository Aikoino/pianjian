<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>片笺</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/title-bar.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/notes.css">
  <link rel="stylesheet" href="css/snap-handles.css">
  <link rel="stylesheet" href="css/sync.css">
</head>
<body>
  <div class="app-container">

    <!-- 贴边书签把手 -->
    <div class="snap-handles" id="snap-handles">
      <div class="snap-handle snap-handle--daily" data-type="daily">
        <span class="snap-handle__label">今日</span>
        <span class="snap-handle__count snap-handle__count--daily"></span>
      </div>
      <div class="snap-handle snap-handle--weekly" data-type="weekly">
        <span class="snap-handle__label">周</span>
        <span class="snap-handle__count snap-handle__count--weekly"></span>
      </div>
      <div class="snap-handle snap-handle--normal" data-type="normal">
        <span class="snap-handle__label">便签</span>
        <span class="snap-handle__count snap-handle__count--normal"></span>
      </div>
      <div class="snap-handle snap-handle--timeline" data-type="timeline">
        <span class="snap-handle__label">时间轴</span>
        <span class="snap-handle__count snap-handle__count--timeline"></span>
      </div>
    </div>

    <!-- 自定义标题栏 -->
    <header class="title-bar">
      <div class="title-bar__drag-area"></div>
      <div class="title-bar__search-wrap" id="search-wrap">
        <button class="title-bar__btn title-bar__search-toggle" id="btn-search" title="搜索">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
        </button>
        <input class="title-bar__search" id="search-input" placeholder="搜索便签…">
      </div>
      <div class="title-bar__actions">
        <button class="title-bar__btn title-bar__btn--add" id="btn-add" title="添加便签">+</button>
        <button class="title-bar__btn title-bar__btn--pin" id="btn-pin" title="置顶">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2v6l4 4v4H8v-4l4-4V2z"/><line x1="8" y1="16" x2="16" y2="16"/>
          </svg>
        </button>
        <button class="title-bar__btn title-bar__btn--autolaunch" id="btn-autolaunch" title="开机自启">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2a10 10 0 1 0 10 10"/><polyline points="12 6 12 12 16 14"/>
          </svg>
        </button>
        <button class="title-bar__btn title-bar__btn--sync" id="btn-sync" title="同步">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="1 4 1 10 7 10"/><polyline points="23 20 23 14 17 14"/>
            <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
          </svg>
        </button>
        <button class="title-bar__btn title-bar__btn--minimize" id="btn-minimize" title="最小化">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
        <button class="title-bar__btn title-bar__btn--close" id="btn-close" title="关闭">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <!-- 添加类型选择弹窗 -->
      <div class="add-popup" id="add-popup">
        <div class="add-popup__item" data-type="daily">
          <span class="add-popup__dot add-popup__dot--daily"></span>
          <span class="add-popup__label">今日待办</span>
        </div>
        <div class="add-popup__item" data-type="weekly">
          <span class="add-popup__dot add-popup__dot--weekly"></span>
          <span class="add-popup__label">周待办</span>
        </div>
        <div class="add-popup__item" data-type="normal">
          <span class="add-popup__dot add-popup__dot--normal"></span>
          <span class="add-popup__label">普通便签</span>
        </div>
        <div class="add-popup__item" data-type="timeline">
          <span class="add-popup__dot add-popup__dot--timeline"></span>
          <span class="add-popup__label">时间轴</span>
        </div>
      </div>
    </header>

    <!-- 同步配对弹窗 -->
    <div class="sync-dialog" id="sync-dialog">
      <div class="sync-dialog__overlay" id="sync-dialog-overlay"></div>
      <div class="sync-dialog__panel">
        <!-- 选择模式 -->
        <div class="sync-dialog__landing" id="sync-landing">
          <h3>局域网同步</h3>
          <p class="sync-dialog__hint">通过局域网连接两台设备，实时同步便签数据</p>
          <button class="sync-dialog__btn sync-dialog__btn--primary sync-dialog__btn--wide" id="sync-start-btn">发起配对</button>
          <button class="sync-dialog__btn sync-dialog__btn--wide" id="sync-join-btn">我有配对码，加入设备</button>
          <button class="sync-dialog__btn sync-dialog__btn--cancel" style="margin-top:8px">取消</button>
        </div>

        <!-- 发起方：显示配对码 -->
        <div class="sync-dialog__pairing" id="sync-pairing" style="display:none">
          <h3>配对码</h3>
          <div class="sync-dialog__code" id="sync-code">----</div>
          <p class="sync-dialog__hint">请在另一台设备上输入此配对码</p>
          <div class="sync-dialog__timer" id="sync-timer">02:00</div>
          <button class="sync-dialog__btn sync-dialog__btn--cancel">取消</button>
          <button class="sync-dialog__link" id="sync-switch-join">我有配对码，加入设备</button>
        </div>

        <!-- 加入方：输入配对码 -->
        <div class="sync-dialog__join" id="sync-join" style="display:none">
          <h3>输入配对码</h3>
          <div class="sync-dialog__code-inputs" id="sync-code-inputs">
            <input maxlength="1" class="sync-dialog__digit" data-index="0" inputmode="numeric" pattern="[0-9]">
            <input maxlength="1" class="sync-dialog__digit" data-index="1" inputmode="numeric" pattern="[0-9]">
            <input maxlength="1" class="sync-dialog__digit" data-index="2" inputmode="numeric" pattern="[0-9]">
            <input maxlength="1" class="sync-dialog__digit" data-index="3" inputmode="numeric" pattern="[0-9]">
            <input maxlength="1" class="sync-dialog__digit" data-index="4" inputmode="numeric" pattern="[0-9]">
            <input maxlength="1" class="sync-dialog__digit" data-index="5" inputmode="numeric" pattern="[0-9]">
          </div>
          <p class="sync-dialog__hint">输入另一台设备上显示的配对码，配对码 2 分钟内有效</p>
          <button class="sync-dialog__btn sync-dialog__btn--primary" id="sync-connect-btn" disabled>连接</button>
          <button class="sync-dialog__btn sync-dialog__btn--cancel">取消</button>
          <button class="sync-dialog__link" id="sync-switch-start">我没有配对码，创建新的</button>
        </div>

        <!-- 连接中 -->
        <div class="sync-dialog__connecting" id="sync-connecting" style="display:none">
          <div class="sync-dialog__spinner"></div>
          <p class="sync-dialog__hint">正在连接...</p>
        </div>

        <!-- 已连接 -->
        <div class="sync-dialog__connected" id="sync-connected" style="display:none">
          <div class="sync-dialog__status">
            <div class="sync-dialog__status-icon sync-dialog__status-icon--connected">&#10003;</div>
            <p class="sync-dialog__status-name" id="sync-peer-name"></p>
            <p class="sync-dialog__hint">已建立连接，便签数据实时同步中</p>
            <button class="sync-dialog__btn sync-dialog__btn--danger" id="sync-disconnect-btn">断开连接</button>
          </div>
        </div>

        <!-- 错误/超时/断开 -->
        <div class="sync-dialog__error" id="sync-error" style="display:none">
          <p class="sync-dialog__error-msg" id="sync-error-msg"></p>
          <button class="sync-dialog__btn sync-dialog__btn--primary sync-dialog__btn--error-close">关闭</button>
        </div>
      </div>
    </div>

    <!-- 内容区域 -->
    <main class="content-area">
      <nav class="sidebar" id="sidebar"></nav>
      <div class="notes-area" id="notes-area"></div>
    </main>

    <!-- 右下角 resize 手柄 -->
    <div class="resize-handle" id="resize-handle"></div>

  </div>

  <script src="js/utils.js"></script>
  <script src="js/state.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/title-bar.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
