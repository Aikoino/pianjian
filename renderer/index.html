<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' file: data:">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>片笺</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/title-bar.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/notes.css">
  <link rel="stylesheet" href="css/snap-handles.css">
  <link rel="stylesheet" href="css/sync.css">
  <link rel="stylesheet" href="css/context-menu.css">
</head>
<body>
  <!-- 更新通知 -->
  <div class="update-banner" id="update-banner" style="display:none">
    <span class="update-banner__text" id="update-text"></span>
    <button class="update-banner__btn" id="btn-update-download">下载</button>
    <button class="update-banner__close" id="btn-update-close">&times;</button>
  </div>

  <div class="app-container">

    <!-- 贴边书签把手 -->
    <div class="snap-handles" id="snap-handles">
      <div class="snap-handle snap-handle--daily" data-type="daily">
        <span class="snap-handle__label">今日</span>
        <span class="snap-handle__count snap-handle__count--daily"></span>
      </div>
      <div class="snap-handle snap-handle--weekly" data-type="weekly">
        <span class="snap-handle__label">周</span>
        <span class="snap-handle__count snap-handle__count--weekly"></span>
      </div>
      <div class="snap-handle snap-handle--normal" data-type="normal">
        <span class="snap-handle__label">便签</span>
        <span class="snap-handle__count snap-handle__count--normal"></span>
      </div>
      <div class="snap-handle snap-handle--timeline" data-type="timeline">
        <span class="snap-handle__label">时间轴</span>
        <span class="snap-handle__count snap-handle__count--timeline"></span>
      </div>
    </div>

    <!-- 自定义标题栏 -->
    <header class="title-bar">
      <div class="title-bar__drag-area"></div>
      <div class="title-bar__search-wrap" id="search-wrap">
        <button class="title-bar__btn title-bar__search-toggle" id="btn-search" title="搜索">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
        </button>
        <input class="title-bar__search" id="search-input" placeholder="搜索便签…">
      </div>
      <div class="title-bar__actions">
        <button class="title-bar__btn title-bar__btn--add" id="btn-add" title="添加便签">+</button>
        <button class="title-bar__btn title-bar__btn--pin" id="btn-pin" title="置顶">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2v6l4 4v4H8v-4l4-4V2z"/><line x1="8" y1="16" x2="16" y2="16"/>
          </svg>
        </button>
        <button class="title-bar__btn title-bar__btn--theme" id="btn-theme" title="切换主题">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <button class="title-bar__btn title-bar__btn--autolaunch" id="btn-autolaunch" title="开机自启">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2a10 10 0 1 0 10 10"/><polyline points="12 6 12 12 16 14"/>
          </svg>
        </button>
        <button class="title-bar__btn title-bar__btn--sync" id="btn-sync" title="同步">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="1 4 1 10 7 10"/><polyline points="23 20 23 14 17 14"/>
            <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
          </svg>
        </button>
        <button class="title-bar__btn title-bar__btn--more" id="btn-more" title="更多">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
            <circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/>
          </svg>
        </button>
        <button class="title-bar__btn title-bar__btn--minimize" id="btn-minimize" title="最小化">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
        <button class="title-bar__btn title-bar__btn--close" id="btn-close" title="关闭">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <!-- 添加类型选择弹窗 -->
      <div class="add-popup" id="add-popup">
        <div class="add-popup__item" data-type="daily">
          <span class="add-popup__dot add-popup__dot--daily"></span>
          <span class="add-popup__label">今日待办</span>
        </div>
        <div class="add-popup__item" data-type="weekly">
          <span class="add-popup__dot add-popup__dot--weekly"></span>
          <span class="add-popup__label">周待办</span>
        </div>
        <div class="add-popup__item" data-type="normal">
          <span class="add-popup__dot add-popup__dot--normal"></span>
          <span class="add-popup__label">普通便签</span>
        </div>
        <div class="add-popup__item" data-type="timeline">
          <span class="add-popup__dot add-popup__dot--timeline"></span>
          <span class="add-popup__label">时间轴</span>
        </div>
      </div>
    </header>

    <!-- 同步下拉面板 -->
    <div class="sync-dropdown" id="sync-dropdown">
      <!-- 选择模式 -->
      <div class="sync-dropdown__panel" id="sync-landing">
        <p class="sync-dropdown__desc">通过局域网连接两台设备，实时同步便签数据</p>
        <button class="sync-dropdown__btn sync-dropdown__btn--primary" id="sync-start-btn">发起配对</button>
        <button class="sync-dropdown__btn" id="sync-join-btn">我有配对码，加入设备</button>
      </div>
      <!-- 发起方：显示配对码 -->
      <div class="sync-dropdown__panel" id="sync-pairing" style="display:none">
        <div class="sync-dropdown__code" id="sync-code">----</div>
        <p class="sync-dropdown__hint">配对码，2 分钟内有效</p>
        <p class="sync-dropdown__server-info" id="sync-server-info"></p>
        <div class="sync-dropdown__timer" id="sync-timer">02:00</div>
        <button class="sync-dropdown__btn sync-dropdown__btn--danger" id="sync-cancel-pairing">取消配对</button>
        <button class="sync-dropdown__link" id="sync-switch-join">我有配对码，加入设备 →</button>
      </div>
      <!-- 加入方：输入配对码 -->
      <div class="sync-dropdown__panel" id="sync-join" style="display:none">
        <p class="sync-dropdown__desc">输入手机上显示的配对码</p>
        <div class="sync-dropdown__digits" id="sync-code-inputs">
          <input maxlength="1" data-index="0" inputmode="numeric" pattern="[0-9]"><input maxlength="1" data-index="1" inputmode="numeric" pattern="[0-9]"><input maxlength="1" data-index="2" inputmode="numeric" pattern="[0-9]"><input maxlength="1" data-index="3" inputmode="numeric" pattern="[0-9]"><input maxlength="1" data-index="4" inputmode="numeric" pattern="[0-9]"><input maxlength="1" data-index="5" inputmode="numeric" pattern="[0-9]">
        </div>
        <input class="sync-dropdown__ip-input" id="sync-ip-input" type="text" placeholder="手机 IP（可选，自动发现失败时填写）" autocomplete="off">
        <button class="sync-dropdown__btn sync-dropdown__btn--primary" id="sync-connect-btn" disabled>连接</button>
        <button class="sync-dropdown__btn sync-dropdown__btn--cancel" id="sync-cancel-join" style="margin-top:4px">取消</button>
      </div>
      <!-- 连接中 -->
      <div class="sync-dropdown__panel" id="sync-connecting" style="display:none">
        <div class="sync-dropdown__spinner"></div>
        <p>正在连接...</p>
        <button class="sync-dropdown__btn sync-dropdown__btn--danger sync-dropdown__btn--sm" id="sync-cancel-connecting" style="margin-top:8px">取消</button>
      </div>
      <!-- 已连接 -->
      <div class="sync-dropdown__panel" id="sync-connected" style="display:none">
        <div style="display:flex;align-items:center;gap:6px;justify-content:center">
          <span style="color:#4CAF50;font-size:16px">●</span>
          <span id="sync-peer-name" style="font-weight:600"></span>
        </div>
        <p class="sync-dropdown__hint">便签数据实时同步中</p>
        <button class="sync-dropdown__btn sync-dropdown__btn--danger sync-dropdown__btn--sm" id="sync-disconnect-btn">断开</button>
      </div>
      <!-- 错误 -->
      <div class="sync-dropdown__panel" id="sync-error" style="display:none">
        <p class="sync-dropdown__error" id="sync-error-msg"></p>
        <button class="sync-dropdown__btn sync-dropdown__btn--sm" id="sync-error-close">关闭</button>
      </div>
    </div>

    <!-- 更多菜单 -->
    <div class="more-menu" id="more-menu">
      <div class="more-menu__item" id="menu-export-json">📦 备份数据 (JSON)</div>
      <div class="more-menu__item" id="menu-import-json">📥 恢复数据 (JSON)</div>
      <div class="more-menu__sep"></div>
      <div class="more-menu__item" id="menu-export-md">📝 导出为 Markdown</div>
    </div>

    <!-- 导出选择面板 -->
    <div class="export-overlay" id="export-overlay">
      <div class="export-panel" id="export-panel">
        <div class="export-panel__header">
          <span class="export-panel__title" id="export-panel-title">选择要导出的便签</span>
          <button class="export-panel__close" id="export-panel-close">&times;</button>
        </div>
        <div class="export-panel__toolbar">
          <label class="export-panel__select-all">
            <input type="checkbox" id="export-select-all" checked> 全选
          </label>
          <span class="export-panel__count" id="export-count"></span>
        </div>
        <div class="export-panel__list" id="export-list"></div>
        <div class="export-panel__footer">
          <button class="export-panel__btn" id="export-cancel">取消</button>
          <button class="export-panel__btn export-panel__btn--primary" id="export-confirm">导出</button>
        </div>
      </div>
    </div>

    <!-- 内容区域 -->
    <main class="content-area">
      <nav class="sidebar" id="sidebar"></nav>
      <div class="notes-area" id="notes-area"></div>
    </main>

    <!-- 右下角 resize 手柄 -->
    <div class="resize-handle" id="resize-handle"></div>

  </div>

  <script src="js/utils.js"></script>
  <script src="js/state.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/context-menu.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/title-bar.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
